[project]
name = "buhgalya-bot"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.31,<4",
    "aiohttp-socks>=0.10,<1",
    "alembic>=1.18,<2",
    "asyncpg>=0.31,<1",
    "fastapi>=0.128,<1",
    "httpx>=0.28,<1",
    "loguru>=0.7.3",
    "pydantic-settings>=2.12,<3",
    "sqlalchemy[asyncio]>=2.0.48,<3",
    "uvicorn[standard]>=0.40,<1",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22,<1",
    "pytest>=9.0,<10",
    "pytest-asyncio>=1.3,<2",
    "ruff>=0.15,<1",
]

[build-system]
requires = ["hatchling>=1.28"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/buhgalya"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"] # FastAPI declarative dependency injection uses Depends in defaults.
