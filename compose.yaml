services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: buhgalya
      POSTGRES_USER: buhgalya
      POSTGRES_PASSWORD: buhgalya
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buhgalya -d buhgalya"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql

  api:
    build: .
    env_file: .env
    command: >
      sh -c "uv run alembic upgrade head && uv run uvicorn buhgalya.api:app --host 0.0.0.0 --port 8000"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  bot:
    build: .
    env_file: .env
    command: uv run python -m buhgalya.telegram.bot
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
