services:
  api:
    build: .
    environment:
      DEFAULT_WORKSPACE_ID: ${DEFAULT_WORKSPACE_ID:?Set DEFAULT_WORKSPACE_ID in the deployment environment}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    command: >
      sh -c "uv run alembic upgrade head && uv run uvicorn buhgalya.api:app --host 0.0.0.0 --port 8000"
    secrets:
      - database_url
    ports:
      - "8000:8000"

  bot:
    build: .
    environment:
      DEFAULT_WORKSPACE_ID: ${DEFAULT_WORKSPACE_ID:?Set DEFAULT_WORKSPACE_ID in the deployment environment}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_BASE_URL: http://api:8000
    command: uv run python -m buhgalya.telegram.bot
    secrets:
      - database_url
      - bot_token
    depends_on:
      api:
        condition: service_started

secrets:
  database_url:
    file: ${SECRETS_DIR:-./secrets}/database_url
  bot_token:
    file: ${SECRETS_DIR:-./secrets}/bot_token
